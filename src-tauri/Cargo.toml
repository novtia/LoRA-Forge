[package]
name = "lora-forge"
version = "0.0.1"
description = "lora-forge (锻模工坊) - LoRA training workbench"
authors = ["you"]
edition = "2021"

[lib]
name = "lora_forge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.50.0", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
sysinfo = "0.38.4"
thiserror = "2.0.18"
reqwest = { version = "0.13.2", features = ["json", "rustls", "form"] }
base64 = "0.22.1"
md5 = "0.7"
