[package]
name = "lora-forge"
version = "0.0.1"
description = "lora-forge (锻模工坊) - LoRA training workbench"
authors = ["you"]
edition = "2021"

[lib]
name = "lora_forge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2.5"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
tokio = { version = "1.50.0", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time", "full"] }
sysinfo = "0.38.4"
thiserror = "2.0.18"
reqwest = { version = "0.13.2", features = ["json", "rustls", "form", "stream"] }
base64 = "0.22.1"
md5 = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
futures-util = "0.3"
zip = { version = "2", features = ["deflate"] }
ulid = "1"
anyhow = "1"
